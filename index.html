<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIG-LAB — Prototipo MVP</title>
<style>
  :root{
    --azul-oscuro:#0B2545;
    --azul-medio:#1B4B91;
    --azul-hover:#123a72;
    --verde:#2E7D46;
    --verde-bg:#E7F4EA;
    --amarillo:#B8860B;
    --amarillo-bg:#FBF1DA;
    --rojo:#B23A32;
    --rojo-bg:#FBE9E7;
    --gris-fondo:#F3F5F7;
    --gris-borde:#DDE3E9;
    --gris-texto:#5B6673;
    --blanco:#FFFFFF;
    --texto:#1A2233;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--gris-fondo);color:var(--texto);}
  a{cursor:pointer;}

  /* ---------- LOGIN ---------- */
  #login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--azul-oscuro) 0%,#173a66 55%,var(--azul-medio) 100%);
  }
  .login-card{
    background:var(--blanco);border-radius:6px;padding:44px 40px;width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .login-card .brand{font-family:var(--font-display);font-size:28px;color:var(--azul-oscuro);margin:0 0 2px;}
  .login-card .brand-sub{font-size:12.5px;color:var(--gris-texto);letter-spacing:.04em;text-transform:uppercase;margin-bottom:26px;}
  .role-btn{
    width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1px solid var(--gris-borde);
    border-radius:5px;background:var(--blanco);cursor:pointer;font-size:14.5px;color:var(--texto);
    display:flex;justify-content:space-between;align-items:center;transition:.15s;
  }
  .role-btn:hover{border-color:var(--azul-medio);background:#F7FAFD;}
  .role-btn small{display:block;color:var(--gris-texto);font-weight:400;margin-top:2px;}
  .role-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--azul-medio);}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;}
  #app.active{display:grid;}
  header{
    grid-column:1/3;background:var(--azul-oscuro);color:#fff;display:flex;align-items:center;
    padding:0 20px;gap:14px;border-bottom:1px solid rgba(255,255,255,.08);
  }
  header .brand{font-family:var(--font-display);font-size:18px;}
  header .divider{width:1px;height:20px;background:rgba(255,255,255,.25);}
  header .empresa-tag{font-size:13px;color:#CBD8EA;}
  header .spacer{flex:1;}
  header .user-tag{font-size:12.5px;color:#CBD8EA;display:flex;align-items:center;gap:8px;}
  header .logout{font-size:12px;color:#CBD8EA;text-decoration:underline;cursor:pointer;}

  nav#sidebar{
    background:#0E2C52;padding:16px 0;overflow-y:auto;
  }
  nav#sidebar .section-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#7C93B5;
    padding:14px 20px 6px;
  }
  nav#sidebar a.nav-item{
    display:block;padding:9px 20px;color:#D6E1F0;text-decoration:none;font-size:13.8px;
    border-left:3px solid transparent;
  }
  nav#sidebar a.nav-item:hover{background:rgba(255,255,255,.05);}
  nav#sidebar a.nav-item.active{
    background:rgba(255,255,255,.08);border-left-color:#5B9BD9;color:#fff;font-weight:600;
  }

  main{padding:26px 34px 60px;overflow-y:auto;}
  .crumb{font-size:12px;color:var(--gris-texto);margin-bottom:6px;}
  h1.page-title{font-family:var(--font-display);font-size:24px;margin:0 0 20px;color:var(--azul-oscuro);}
  h2.section-title{font-size:15px;margin:28px 0 12px;color:var(--azul-oscuro);border-bottom:1px solid var(--gris-borde);padding-bottom:8px;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:8px;}
  .card{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:6px;padding:16px 18px;}
  .card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris-texto);margin-bottom:6px;}
  .card .value{font-size:26px;font-family:var(--font-display);color:var(--azul-oscuro);}
  .progress-bar{height:8px;background:var(--gris-borde);border-radius:4px;overflow:hidden;margin-top:10px;}
  .progress-fill{height:100%;background:var(--azul-medio);}

  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .dot.verde{background:var(--verde);} .dot.amarillo{background:var(--amarillo);}
  .dot.rojo{background:var(--rojo);} .dot.gris{background:#A7B0BC;}

  .badge{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:20px;font-weight:600;}
  .badge.verde{background:var(--verde-bg);color:var(--verde);}
  .badge.amarillo{background:var(--amarillo-bg);color:var(--amarillo);}
  .badge.rojo{background:var(--rojo-bg);color:var(--rojo);}
  .badge.gris{background:#EEF1F4;color:var(--gris-texto);}

  table{width:100%;border-collapse:collapse;background:var(--blanco);border:1px solid var(--gris-borde);border-radius:6px;overflow:hidden;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris-texto);background:#FAFBFC;padding:10px 14px;border-bottom:1px solid var(--gris-borde);}
  td{padding:11px 14px;font-size:13.6px;border-bottom:1px solid #EEF1F4;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  code.doc-code{font-family:var(--font-mono);font-size:12.5px;background:#F1F4F8;padding:2px 6px;border-radius:3px;}

  .panel{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:6px;padding:22px 24px;margin-bottom:18px;}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:12.8px;font-weight:600;color:var(--texto);margin-bottom:5px;}
  .form-row .hint{font-size:11.8px;color:var(--gris-texto);margin-bottom:6px;font-style:italic;}
  .form-row input, .form-row select, .form-row textarea{
    width:100%;padding:9px 11px;border:1px solid var(--gris-borde);border-radius:4px;font-size:13.6px;
    font-family:var(--font-body);background:#fff;
  }
  .form-row textarea{min-height:70px;resize:vertical;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .btn{
    display:inline-block;padding:9px 18px;border-radius:4px;border:none;font-size:13.5px;font-weight:600;
    cursor:pointer;background:var(--azul-medio);color:#fff;
  }
  .btn:hover{background:var(--azul-hover);}
  .btn.secondary{background:#fff;color:var(--azul-medio);border:1px solid var(--azul-medio);}
  .btn.small{padding:5px 11px;font-size:12px;}
  .btn.ghost{background:transparent;color:var(--gris-texto);border:1px solid var(--gris-borde);}
  .btn.ok{background:var(--verde);} .btn.ok:hover{background:#245f37;}
  .btn.warn{background:var(--rojo);} .btn.warn:hover{background:#8f2e28;}

  .proc-map{display:flex;flex-direction:column;gap:22px;}
  .proc-row-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris-texto);margin-bottom:8px;}
  .proc-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .proc-box{
    background:#fff;border:1.5px solid var(--azul-medio);border-radius:6px;padding:10px 14px;min-width:150px;
    font-size:13px;cursor:pointer;position:relative;
  }
  .proc-box.selected{background:#EAF1FB;box-shadow:0 0 0 2px var(--azul-medio);}
  .proc-box .pcode{font-family:var(--font-mono);font-size:10.5px;color:var(--gris-texto);}
  .proc-arrow{color:var(--gris-texto);font-size:16px;}
  .proc-row.apoyo .proc-box{border-color:#7C93B5;}
  .proc-row.estrategico .proc-box{border-color:var(--azul-oscuro);background:#F2F6FB;}
  .proc-row.evaluacion .proc-box{border-color:#8A6D3B;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--azul-oscuro);color:#fff;padding:12px 18px;
    border-radius:5px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:50;
  }
  .empty-note{color:var(--gris-texto);font-size:13px;padding:14px 0;}
  .flag{background:var(--amarillo-bg);border:1px solid #E7CE9A;color:#7A5A16;padding:10px 14px;border-radius:5px;font-size:13px;margin-bottom:16px;}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--azul-medio);font-weight:700;margin-bottom:4px;}
  .team-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #EEF1F4;}
  .team-row:last-child{border-bottom:none;}
  .team-row .name{flex:0 0 190px;font-weight:600;font-size:13.8px;}
  .team-row .bar-wrap{flex:1;}
  .comment{background:#F7F9FB;border-left:3px solid var(--azul-medio);padding:8px 12px;border-radius:0 4px 4px 0;font-size:13px;margin-top:8px;}

  /* ---------- Tabs (matrices) ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--gris-borde);margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{
    padding:9px 14px;font-size:13px;border:none;background:transparent;cursor:pointer;color:var(--gris-texto);
    border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;
  }
  .tab-btn.active{color:var(--azul-oscuro);border-bottom-color:var(--azul-medio);}
  .tab-btn:hover{color:var(--azul-medio);}

  /* ---------- DOFA ---------- */
  .dofa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .dofa-box{border-radius:6px;padding:14px 16px;}
  .dofa-box.F{background:var(--verde-bg);}
  .dofa-box.O{background:#E7F0FB;}
  .dofa-box.D{background:var(--amarillo-bg);}
  .dofa-box.A{background:var(--rojo-bg);}
  .dofa-box h3{margin:0 0 8px;font-size:13.5px;}
  .dofa-box ul{margin:0 0 10px;padding-left:18px;font-size:13px;}
  .dofa-box li{margin-bottom:4px;}
  .dofa-add{display:flex;gap:6px;}
  .dofa-add input{flex:1;padding:7px 9px;border:1px solid var(--gris-borde);border-radius:4px;font-size:12.8px;}
  .del-link{color:var(--rojo);font-size:11px;margin-left:6px;cursor:pointer;}

  /* ---------- Mapa editable ---------- */
  .map-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .proc-box .remove-x{
    position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--rojo);
    color:#fff;font-size:11px;line-height:18px;text-align:center;display:none;
  }
  .proc-box:hover .remove-x{display:block;}
  .inline-form{background:#F7F9FB;border:1px dashed var(--gris-borde);border-radius:6px;padding:16px;margin-bottom:16px;}

  /* ---------- Organigrama vertical (jerárquico clásico) ---------- */
  .orgv-wrap{overflow-x:auto;padding:26px 20px;min-height:120px;}
  .orgv, .orgv ul{margin:0;padding:0;list-style:none;}
  .orgv, .orgv ul{display:table;margin:0 auto;}
  .orgv li{display:table-cell;text-align:center;vertical-align:top;padding:34px 20px 0 20px;position:relative;}
  .orgv li::before, .orgv li::after{
    content:'';position:absolute;top:0;right:50%;width:50%;height:34px;border-top:2px solid var(--azul-medio);
  }
  .orgv li::after{right:auto;left:50%;border-left:2px solid var(--azul-medio);}
  .orgv li:only-child::after, .orgv li:only-child::before{display:none;}
  .orgv li:only-child{padding-top:0;}
  .orgv li:first-child::before, .orgv li:last-child::after{border:0 none;}
  .orgv li:last-child::before{border-right:2px solid var(--azul-medio);border-radius:0 5px 0 0;}
  .orgv li:first-child::after{border-radius:5px 0 0 0;}
  .orgv ul::before{
    content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--azul-medio);width:0;height:34px;
  }
  .orgv-wrap > .orgv::before{display:none;}
  .org-box{
    border:1.5px solid var(--azul-medio);padding:10px 16px;display:inline-block;border-radius:6px;
    background:#fff;font-size:12.5px;position:relative;line-height:1.4;min-width:100px;
  }
  .org-box .move-links{margin-top:6px;font-size:10.5px;white-space:nowrap;}
  .org-radial-box{
    position:absolute;background:#fff;border:1.5px solid var(--azul-medio);border-radius:6px;
    padding:5px 7px;font-size:10.5px;text-align:center;line-height:1.3;
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card" id="loginCard"></div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <header>
    <span class="brand">SIG-LAB</span>
    <div class="divider"></div>
    <span class="empresa-tag" id="hdrEmpresa">Alimentos del Norte S.A.S.</span>
    <div class="spacer"></div>
    <span class="user-tag" id="hdrUser"></span>
    <span class="logout" data-action="logout">Cerrar sesión</span>
  </header>
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div id="pdfTemplate" style="position:fixed;left:-10000px;top:0;width:794px;background:#fff;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   CONEXIÓN REAL A SUPABASE
   ===================================================================== */
const SUPABASE_URL = 'https://zqanpqqzynwkekldigje.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Qu4KNpEMHWVLnk_vMG0Iyw_a2G_LZRC';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function traducirErrorAuth(error){
  const msg = (error && error.message) || '';
  if(msg.includes('Invalid login credentials')) return 'Correo o contraseña incorrectos.';
  if(msg.includes('User already registered')) return 'Ese correo ya tiene una cuenta.';
  if(msg.includes('Password should be')) return 'La contraseña debe tener al menos 6 caracteres.';
  return msg || 'Ocurrió un error inesperado.';
}
async function sbIniciarSesion(correo, password){
  const { data, error } = await sb.auth.signInWithPassword({ email: correo, password });
  if(error) return { ok:false, error: traducirErrorAuth(error) };
  const { data: perfil, error: errPerfil } = await sb.from('perfiles').select('*').eq('id', data.user.id).single();
  if(errPerfil || !perfil) return { ok:false, error:'Tu cuenta no tiene un perfil asociado. Contacta al administrador.' };
  if(perfil.activo === false){ await sb.auth.signOut(); return { ok:false, error:'Esta cuenta está desactivada. Contacta a tu docente.' }; }
  return { ok:true, perfil };
}
async function sbRegistrarEstudiante({ nombre, correo, password, equipoId }){
  const { count: ocupados } = await sb.from('integrantes_equipo').select('*', { count:'exact', head:true }).eq('equipo_id', equipoId);
  const { data: equipo, error: errEquipo } = await sb.from('equipos').select('cupo_maximo, lider_id').eq('id', equipoId).single();
  if(errEquipo || !equipo) return { ok:false, error:'Grupo no encontrado.' };
  if((ocupados||0) >= equipo.cupo_maximo) return { ok:false, error:'Ese grupo ya alcanzó su cupo máximo de integrantes.' };

  const { data, error } = await sb.auth.signUp({ email: correo, password, options: { data: { nombre, rol:'estudiante' } } });
  if(error) return { ok:false, error: traducirErrorAuth(error) };

  // Respaldo: si el disparador automático no alcanzó a crear el perfil, lo creamos aquí mismo.
  const { data: perfilExistente } = await sb.from('perfiles').select('id').eq('id', data.user.id).maybeSingle();
  if(!perfilExistente){
    const { error: errPerfil } = await sb.from('perfiles').insert({ id: data.user.id, nombre, rol:'estudiante', activo:true });
    if(errPerfil) return { ok:false, error:'Cuenta creada, pero no se pudo generar tu perfil: ' + errPerfil.message };
  }

  const { error: errIntegrante } = await sb.from('integrantes_equipo').insert({ equipo_id: equipoId, usuario_id: data.user.id });
  if(errIntegrante) return { ok:false, error:'Cuenta creada, pero no se pudo unir al equipo: ' + errIntegrante.message };

  if(!equipo.lider_id) await sb.from('equipos').update({ lider_id: data.user.id }).eq('id', equipoId);

  const { data: perfil } = await sb.from('perfiles').select('*').eq('id', data.user.id).single();
  return { ok:true, perfil };
}
async function sbCerrarSesion(){ await sb.auth.signOut(); }

async function sbListarInstituciones(){
  const { data, error } = await sb.from('instituciones').select('*').order('nombre');
  return error ? [] : data;
}
async function sbListarPeriodos(){
  const { data, error } = await sb.from('periodos_academicos').select('*, cursos(count)').order('nombre', { ascending:false });
  return error ? [] : data;
}
async function sbCrearPeriodo({ institucionId, nombre, fechaInicio, fechaFin }){
  const { error } = await sb.from('periodos_academicos').insert({ institucion_id:institucionId, nombre, fecha_inicio:fechaInicio||null, fecha_fin:fechaFin||null });
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbEliminarPeriodo(id){
  const { error } = await sb.from('periodos_academicos').delete().eq('id', id);
  return error ? { ok:false, error:'No se puede eliminar: revisa que ningún curso lo esté usando.' } : { ok:true };
}
async function sbListarCursos(){
  const { data, error } = await sb.from('cursos').select('*, periodos_academicos(nombre), equipos(count)').order('creado_en', { ascending:false });
  return error ? [] : data;
}
async function sbListarDocentes(){
  const { data, error } = await sb.from('perfiles').select('id, nombre').eq('rol','docente').eq('activo', true);
  return error ? [] : data;
}
async function sbCrearCurso({ institucionId, periodoId, nombre, docenteId }){
  const { error } = await sb.from('cursos').insert({ institucion_id:institucionId, periodo_id:periodoId, nombre, docente_id: docenteId||null });
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbEliminarCurso(id){
  const { error } = await sb.from('cursos').delete().eq('id', id);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbAsignarDocenteCurso(cursoId, docenteId){
  const { error } = await sb.from('cursos').update({ docente_id: docenteId||null }).eq('id', cursoId);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbListarEquipos(){
  const { data, error } = await sb.from('equipos')
    .select('*, cursos(nombre), integrantes_equipo(usuario_id, perfiles(id, nombre, activo)), empresas_simuladas(*)')
    .order('creado_en');
  return error ? [] : data;
}
async function sbCrearEquipo({ cursoId, nombre, cupoMaximo }){
  const { data, error } = await sb.from('equipos').insert({ curso_id:cursoId, nombre, cupo_maximo:cupoMaximo||4 }).select().single();
  if(error) return { ok:false, error:error.message };
  const { error: errEmpresa } = await sb.from('empresas_simuladas').insert({ equipo_id: data.id });
  if(errEmpresa){
    return { ok:true, equipo:data, avisoEmpresa:'El equipo se creó, pero su ficha de empresa no pudo generarse automáticamente: ' + errEmpresa.message };
  }
  return { ok:true, equipo:data };
}
async function sbEliminarEquipo(id){
  const { error } = await sb.from('equipos').delete().eq('id', id);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbAsignarLider(equipoId, usuarioId){
  const { error } = await sb.from('equipos').update({ lider_id:usuarioId }).eq('id', equipoId);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbListarUsuarios(){
  const { data, error } = await sb.from('perfiles').select('*, integrantes_equipo(equipo_id, equipos(nombre))').order('creado_en');
  return error ? [] : data;
}
async function sbToggleActivoUsuario(usuarioId, activo){
  const { error } = await sb.from('perfiles').update({ activo }).eq('id', usuarioId);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbActualizarNombreUsuario(usuarioId, nombre){
  const { error } = await sb.from('perfiles').update({ nombre }).eq('id', usuarioId);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbSacarIntegranteDeEquipo(equipoId, usuarioId){
  const { error } = await sb.from('integrantes_equipo').delete().eq('equipo_id', equipoId).eq('usuario_id', usuarioId);
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function sbCrearEstudianteDocente({ nombre, correo, password, equipoId }){
  const { data: sesion } = await sb.auth.getSession();
  try{
    const { data, error } = await sb.functions.invoke('crear-estudiante', {
      body: { nombre, correo, password, equipoId },
      headers: { Authorization: `Bearer ${sesion.session.access_token}` }

/** Carga los cuatro módulos del Lote 1 desde Supabase hacia el estado local. */
async function cargarLote1(empresaId){
  const [planeacion, politicas, objetivos, cargos, partes] = await Promise.all([
    sbObtenerPlaneacion(empresaId),
    sbListarPoliticas(empresaId),
    sbListarObjetivos(empresaId),
    sbListarCargos(empresaId),
    sbListarPartesInteresadas(empresaId)
  ]);

  state.planeacion = { mision: (planeacion && planeacion.mision) || '', vision: (planeacion && planeacion.vision) || '' };

  state.politicas = politicas.map(p=>({ id:p.id, tipo:p.tipo, texto:p.texto }));

  const cargosPorId = {}; cargos.forEach(c=>{ cargosPorId[c.id]=c; });
  state.cargos = cargos.map(c=>({
    id: c.id, cargo: c.nombre_cargo, area: c.area,
    superior: c.superior_id && cargosPorId[c.superior_id] ? cargosPorId[c.superior_id].nombre_cargo : ''
  }));

  state.objetivos = objetivos.map(o=>({ id:o.id, codigo:o.codigo, tipo:o.tipo, descripcion:o.descripcion, meta:o.meta }));

  state.partesInteresadas = partes.map(p=>({
    id: p.id, nombre: p.nombre, tipo: p.tipo, necesidades: p.necesidades, requisitos: p.requisitos,
    influencia: p.influencia, interes: p.interes, responsable: p.responsable, comunicacion: p.mecanismo_comunicacion
  }));
}

async function sbCrearDocumentoGenerico(empresaId, { codigo, nombre, tipo, procesoCodigo, contenido, items }){
  const procesoId = await sbBuscarProcesoIdPorCodigo(empresaId, procesoCodigo);
  const { data: doc, error } = await sb.from('documentos')
    .insert({ empresa_id: empresaId, proceso_id: procesoId, codigo, nombre, tipo, version:'V01', estado:'borrador' })
    .select().single();
  if(error) return { ok:false, error:error.message };

  });

function adaptarFilaDocumento(d){
  const base = {
    id: d.id, codigo: d.codigo, nombre: d.nombre, tipo: DOC_TIPO_LABEL_FULL[d.tipo] || d.tipo,
    proceso: d.procesos ? d.procesos.codigo : '', version: d.version,
    estado: ESTADO_DOC_DB_A_UI[d.estado] || d.estado,
    empresaNombre: d.empresas_simuladas ? d.empresas_simuladas.nombre : '',
    empresaLogo: d.empresas_simuladas ? d.empresas_simuladas.logo_url : null
  };
  if(d.tipo === 'procedimiento'){
    base.procedimientoId = d.id;
  } else {
    const cRel = d.contenido_documento;
    const c = Array.isArray(cRel) ? cRel[0] : cRel;
    if(c){
      base.tipoInterno = d.tipo;
      base.contenido = {
        objeto: c.objeto, alcance: c.alcance, responsable: c.responsable, texto: c.texto,
        elaboro: c.elaboro, elaboroCargo: c.elaboro_cargo, reviso: c.reviso, revisoCargo: c.reviso_cargo,
        aprobo: c.aprobo, aproboCargo: c.aprobo_cargo, fecha: c.fecha_elaboracion,
        items: (d.items_documento||[]).map(it=>({ a: it.campo_a, b: it.campo_b }))
      };
    }
  }
  return base;
}
function adaptarFilaProcedimiento(d){
  const pRel = d.procedimientos;
  const p = Array.isArray(pRel) ? pRel[0] : pRel;
  return {
    id: d.id, codigo: d.codigo, nombre: d.nombre, fecha: p ? p.fecha_elaboracion : '', version: d.version,
    objetivo: p ? p.objetivo : '', alcance: p ? p.alcance : '', responsable: p ? p.responsable : '',
    actividades: (d.actividades_procedimiento||[]).slice().sort((a,b)=>a.orden-b.orden)
      .map(a=>({ descripcion: a.descripcion, responsable: a.responsable, evidencia: a.evidencia })),
    elaboro: p ? p.elaboro : '', elaboroCargo: p ? p.elaboro_cargo : '',
    reviso: p ? p.reviso : '', revisoCargo: p ? p.reviso_cargo : '',
    aprobo: p ? p.aprobo : '', aproboCargo: p ? p.aprobo_cargo : ''
  };
}

/** Carga las cinco matrices desde Supabase hacia el estado local. */
async function cargarLote4(empresaId){
  const [dofa, requisitos, riesgosOp, sst, ambiental] = await Promise.all([
    sbListarDofa(empresaId), sbListarRequisitos(empresaId), sbListarRiesgosOp(empresaId),
    sbListarSST(empresaId), sbListarAmbiental(empresaId)
  ]);

  state.dofa = {F:[],O:[],D:[],A:[]};
  dofa.forEach(d=>{ if(state.dofa[d.categoria]) state.dofa[d.categoria].push({ id:d.id, texto:d.texto }); });

  state.requisitosLegales = requisitos.map(r=>({
    id:r.id, codigo:r.codigo, fuente:r.fuente, descripcion:r.descripcion,
    proceso: r.procesos ? r.procesos.codigo : '', responsable:r.responsable,
    estado: ESTADO_REQ_DB_A_UI[r.estado] || r.estado
  }));

  state.riesgosOportunidades = riesgosOp.map(r=>({
    id:r.id, tipo: TIPO_RO_DB_A_UI[r.tipo] || r.tipo, proceso: r.procesos ? r.procesos.codigo : '',
    evento:r.evento, causa:r.causa, probabilidad:r.probabilidad, impacto:r.impacto, control:r.control, estado:r.estado
  }));

  state.sstPeligros = sst.map(s=>({
    id:s.id, proceso: s.procesos ? s.procesos.codigo : '', zona:s.zona, peligro:s.peligro,
    clasificacion:s.clasificacion, efectos:s.efectos_posibles, controles:s.controles_existentes,
    probabilidad: PROB_SST_DB_A_UI[s.probabilidad] || s.probabilidad,
    consecuencia: CONS_SST_DB_A_UI[s.consecuencia] || s.consecuencia
  }));

  state.riesgosAmbientales = ambiental.map(a=>({
    id:a.id, proceso: a.procesos ? a.procesos.codigo : '', aspecto:a.aspecto_ambiental, impacto:a.impacto_ambiental,
    condicion: COND_AMB_DB_A_UI[a.condicion] || a.condicion, probabilidad:a.probabilidad, severidad:a.severidad, control:a.control
  }));
}

/** Calcula cuántos "ítems" alimentan cada indicador (situaciones, problemas, decisiones),
    y con eso el peso exacto que debe valer cada uno para que el máximo posible sea 100%. */
function calcularPesosIndicadoresReto(){
  const conteo = {organizacion5s:0, eficiencia:0, conformes:0, desperdicios:0, seguridad:0};
  conteo.eficiencia += SITUACIONES_RETO.length;     // acierto de etapa, en las 10 situaciones
  conteo.organizacion5s += SITUACIONES_RETO.length; // acierto de principio 5S, en las 10 situaciones
  PROBLEMAS_RETO.forEach(p=> conteo[p.indicador]++);
  DECISIONES_RETO.forEach(d=> conteo[d.indicador]++);
  const peso = {};
  Object.keys(conteo).forEach(k=> peso[k] = 50 / conteo[k]);
  return peso;
}
const PESO_ITEM_RETO = calcularPesosIndicadoresReto();

function calcularIndicadoresReto(respSituaciones, decisionesSeleccionadas, respuestasProblemas){
  const ind = {organizacion5s:50, eficiencia:50, conformes:50, desperdicios:50, seguridad:50};
  SITUACIONES_RETO.forEach(s=>{
    const r = respSituaciones[s.id];
    if(!r) return;
    if(r.etapa===s.etapa) ind.eficiencia += PESO_ITEM_RETO.eficiencia;
    if(r.principio===s.principio) ind.organizacion5s += PESO_ITEM_RETO.organizacion5s;
  });
  DECISIONES_RETO.forEach(d=>{
    if(decisionesSeleccionadas.includes(d.id)) ind[d.indicador] += PESO_ITEM_RETO[d.indicador];
  });
  if(respuestasProblemas){
    PROBLEMAS_RETO.forEach(p=>{
      const opcionElegida = respuestasProblemas[p.id];
      if(!opcionElegida) return;
      const opcion = p.opciones.find(o=>o.id===opcionElegida);
      if(opcion && opcion.correcta) ind[p.indicador] += PESO_ITEM_RETO[p.indicador];
    });
  }
  Object.keys(ind).forEach(k=> ind[k] = Math.min(100, Math.round(ind[k])) );
  const global = Math.round((ind.organizacion5s+ind.eficiencia+ind.conformes+ind.desperdicios+ind.seguridad)/5);
  return { ...ind, global };
}

/** Explica, indicador por indicador, de dónde sale cada punto que compone el porcentaje final. */
function desglosarIndicadoresReto(respuestas){
  const desglose = {organizacion5s:[], eficiencia:[], conformes:[], desperdicios:[], seguridad:[]};
  Object.keys(desglose).forEach(k=> desglose[k].push({texto:'Punto de partida', puntos:50}));

  let aciertosEtapa=0, aciertosPrincipio=0;
  SITUACIONES_RETO.forEach(s=>{
    const r = respuestas.situaciones[s.id] || {};
    if(r.etapa===s.etapa) aciertosEtapa++;
    if(r.principio===s.principio) aciertosPrincipio++;
  });
  const ptsEtapa = Math.round(aciertosEtapa*PESO_ITEM_RETO.eficiencia);
  const ptsPrincipio = Math.round(aciertosPrincipio*PESO_ITEM_RETO.organizacion5s);
  if(aciertosEtapa>0) desglose.eficiencia.push({texto:`${aciertosEtapa} de 10 situaciones ubicadas correctamente en la cadena de valor (Etapa 2: Identificación de problemas)`, puntos:ptsEtapa});
  if(aciertosEtapa<10) desglose.eficiencia.push({texto:`${10-aciertosEtapa} de 10 situaciones con la etapa equivocada — revisa el Plan de mejora abajo`, puntos:0});
  if(aciertosPrincipio>0) desglose.organizacion5s.push({texto:`${aciertosPrincipio} de 10 situaciones con el principio 5S correcto (Etapa 3: Aplicación de las 5S)`, puntos:ptsPrincipio});
  if(aciertosPrincipio<10) desglose.organizacion5s.push({texto:`${10-aciertosPrincipio} de 10 situaciones con el principio 5S equivocado — revisa el Plan de mejora abajo`, puntos:0});

  PROBLEMAS_RETO.forEach(p=>{
    const elegida = (respuestas.problemas||{})[p.id];
    const opcion = elegida ? p.opciones.find(o=>o.id===elegida) : null;
    const nombreCaso = p.texto.split('¿')[0].trim();
    if(opcion && opcion.correcta) desglose[p.indicador].push({texto:`Decisión correcta en el caso "${nombreCaso}" (Etapa 4)`, puntos:Math.round(PESO_ITEM_RETO[p.indicador])});
    else desglose[p.indicador].push({texto:`Decisión no óptima en el caso "${nombreCaso}" — revisa el Plan de mejora abajo`, puntos:0});
  });

  DECISIONES_RETO.forEach(d=>{
    if((respuestas.decisiones||[]).includes(d.id)) desglose[d.indicador].push({texto:`Acción adicional seleccionada: "${d.texto}" (Etapa 4)`, puntos:Math.round(PESO_ITEM_RETO[d.indicador])});
  });

  return desglose;
}

/** Arma el listado de puntos concretos de mejora a partir de las respuestas del equipo. */
function generarPlanMejoraReto(respuestas, indicadores){
  const puntos = [];

  SITUACIONES_RETO.forEach(s=>{
    const r = respuestas.situaciones[s.id] || {};
    const etapaMal = r.etapa !== s.etapa;
    const principioMal = r.principio !== s.principio;
    if(etapaMal || principioMal){
      const etapaCorrecta = CADENA_VALOR_RETO.find(c=>c.id===s.etapa);
      const principioCorrecto = PRINCIPIOS_5S.find(p=>p.id===s.principio);
      let detalle = `"${s.texto}"`;
      if(etapaMal) detalle += ` — en realidad ocurre en "${etapaCorrecta.nombre}"`;
      if(principioMal) detalle += ` — el principio que aplica es ${principioCorrecto.nombre}`;
      puntos.push({ tema:'Análisis del proceso', texto: detalle });
    }
  });

  PROBLEMAS_RETO.forEach(p=>{
    const elegida = (respuestas.problemas||{})[p.id];
    const opcion = elegida ? p.opciones.find(o=>o.id===elegida) : null;
    if(opcion && !opcion.correcta){
      const correcta = p.opciones.find(o=>o.correcta);
      puntos.push({ tema:'Toma de decisiones', texto: `Caso "${p.texto.split('¿')[0].trim()}" — la decisión más adecuada era: "${correcta.texto}".` });
    }
  });

  const INDICADORES_BAJO_UMBRAL = Object.keys(INDICADOR_RETO_LABEL).filter(k=>indicadores[k] < 80);
  INDICADORES_BAJO_UMBRAL.forEach(k=>{
    const sinSeleccionar = DECISIONES_RETO.filter(d=>d.indicador===k && !(respuestas.decisiones||[]).includes(d.id));
    if(sinSeleccionar.length){
      puntos.push({ tema: INDICADOR_RETO_LABEL[k], texto: `Para fortalecer este indicador, considera también: ${sinSeleccionar.map(d=>`"${d.texto}"`).join(', ')}.` });
    }
  });

  return puntos;
}

async function sbObtenerRetoProduccion(equipoId){
  const { data, error } = await sb.from('reto_produccion').select('*').eq('equipo_id', equipoId).maybeSingle();
  return error ? null : data;
}
async function sbGuardarRetoProduccion(equipoId, { etapa, respuestas, indicadores, completado }){
  const existente = await sbObtenerRetoProduccion(equipoId);
  const campos = { etapa, respuestas, indicadores: indicadores||null, completado: !!completado, actualizado_en: new Date().toISOString() };
  if(existente){
    const { error } = await sb.from('reto_produccion').update(campos).eq('equipo_id', equipoId);
    return error ? { ok:false, error:error.message } : { ok:true };
  }
  const { error } = await sb.from('reto_produccion').insert({ equipo_id: equipoId, ...campos });
  return error ? { ok:false, error:error.message } : { ok:true };
}
async function cargarRetoProduccion(equipoId){
  const fila = await sbObtenerRetoProduccion(equipoId);
  state.retoProduccion = fila ? {
    etapa: fila.etapa, respuestas: fila.respuestas||{}, indicadores: fila.indicadores, completado: fila.completado
  } : { etapa:1, respuestas:{situaciones:{}, decisiones:[], problemas:{}}, indicadores:null, completado:false };
  if(!state.retoProduccion.respuestas.situaciones) state.retoProduccion.respuestas.situaciones = {};
  if(!state.retoProduccion.respuestas.decisiones) state.retoProduccion.respuestas.decisiones = [];
  if(!state.retoProduccion.respuestas.problemas) state.retoProduccion.respuestas.problemas = {};
}

    case 'toggleAddProceso': toggleAddProceso(); break;

    case 'descargarMapa': descargarMapa(); break;

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'f_proc_sel'){
    selectProceso(e.target.value);
    go('caracterizacion');
  }
  if(e.target && e.target.id === 'u_rol'){
    const row = document.getElementById('u_grupo_row');
    if(row) row.style.display = (e.target.value==='Estudiante') ? 'block' : 'none';
  }
  if(e.target && e.target.id === 'tipo_organigrama'){
    state.tipoOrganigrama = e.target.value;
    renderMain();
  }
  if(e.target && e.target.id === 'trazabilidad_proceso'){
    state.procesoTrazabilidad = parseInt(e.target.value,10);
    renderMain();
  }
  if(e.target && e.target.id && e.target.id.startsWith('reto_etapa_') && e.target.value){
    seleccionarEtapaSituacionReto(e.target.dataset.situacion, e.target.value);
  }
  if(e.target && e.target.id && e.target.id.startsWith('reto_principio_') && e.target.value){
    seleccionarPrincipioSituacionReto(e.target.dataset.situacion, e.target.value);
  }
  if(e.target && e.target.id === 'f_logo' && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    if(!file.type.startsWith('image/')){ showToast('Selecciona un archivo de imagen (JPG, PNG o SVG)'); return; }
    if(file.size > 2*1024*1024){ showToast('La imagen es muy pesada, usa un archivo de menos de 2 MB'); return; }

    if(state.empresa.id){
      // Conectado a Supabase: se sube de verdad al almacenamiento en la nube
      showToast('Subiendo logotipo...');
      sbSubirLogo(state.empresa.id, file).then(r=>{
        if(!r.ok){ showToast('No se pudo subir el logotipo: ' + r.error); return; }
        state.empresa.logo = r.url;
        const miEquipo = state.equipos.find(eq=>eq.id===state.miEquipoId);
        if(miEquipo) miEquipo.logo = r.url;
        const preview = document.getElementById('logoPreview');
        const wrap = document.getElementById('logoPreviewWrap');
        if(preview) preview.src = r.url;
        if(wrap) wrap.style.display = 'flex';
        showToast('Logotipo guardado en la nube ✓');
      });
      return;
    }

    const reader = new FileReader();
    reader.onload = function(ev){
      state.empresa.logo = ev.target.result;
      const miEquipo = state.equipos.find(eq=>eq.id===state.miEquipoId);
      if(miEquipo) miEquipo.logo = ev.target.result;
      const preview = document.getElementById('logoPreview');
      const wrap = document.getElementById('logoPreviewWrap');
      if(preview) preview.src = ev.target.result;
      if(wrap) wrap.style.display = 'flex';
      showToast('Logotipo cargado. Se incluirá en tus próximos documentos PDF.');
    };
    reader.readAsDataURL(file);
  }
});

const ROL_SB_A_INTERNO = {administrador:'admin', docente:'docente', estudiante:'estudiante'};

async function cargarDatosDesdeSupabase(){
  const [periodos, cursos, equipos, usuarios] = await Promise.all([
    sbListarPeriodos(), sbListarCursos(), sbListarEquipos(), sbListarUsuarios()
  ]);
  state.periodos = periodos.map(adaptarPeriodoSb);
  state.cursos = cursos.map(adaptarCursoSb);
  state.equipos = equipos.map(adaptarEquipoSb);
  state.usuarios = usuarios.map(u=>({
    id: u.id, nombre: u.nombre,
    rol: {administrador:'Administrador', docente:'Docente', estudiante:'Estudiante'}[u.rol] || u.rol,
    activo: u.activo,
    equipoId: (u.integrantes_equipo && u.integrantes_equipo[0]) ? u.integrantes_equipo[0].equipo_id : null
  }));
}

async function loginAs(perfil){
  state.currentUser = perfil;
  state.role = ROL_SB_A_INTERNO[perfil.rol] || 'estudiante';
  showToast('Cargando tu información...');
  await cargarDatosDesdeSupabase();

  if(state.role==='estudiante'){
    const miEquipoRow = await sbObtenerMiEquipo();
    if(miEquipoRow){
      const eq = adaptarEquipoSb(miEquipoRow);
      const es = miEquipoRow.empresas_simuladas || {};
      state.miEquipoId = eq.id;
      state.equipos = [eq, ...state.equipos.filter(e=>e.id!==eq.id)];
      state.empresa = {
        id: es.id || null,
        nombre: (eq.empresa===EMPRESA_PENDIENTE) ? '' : eq.empresa,
        sector: eq.sector, actividad: eq.actividad, tamano: es.tamano || '',
        trabajadores: eq.trabajadores, ubicacion: eq.ubicacion,
        clientes: es.clientes || '', proveedores: es.proveedores || '',
        descripcion: eq.descripcion, alcanceSIG: es.alcance_sig || '', logo: eq.logo || null
      };
      if(state.empresa.id){
        await cargarLote1(state.empresa.id);
        await cargarLote2(state.empresa.id);
        await cargarLote3(state.empresa.id);
        await cargarLote4(state.empresa.id);
        await cargarIndicadores(state.empresa.id);
        await cargarNoConformidades(state.empresa.id);
        await cargarAccionesPreventivas(state.empresa.id);
      }
      await cargarMisIncidentes(eq.id);
      await cargarRetoProduccion(eq.id);
      if(eq.cursoId) await cargarRubricaYCalificaciones(eq.cursoId);
    }
  } else if(state.role==='docente'){
    await cargarDocumentosPendientesDocente();
    await cargarIncidentesDocente();
    await cargarRetosDocente();
    if(state.cursos.length) await cargarRubricaYCalificaciones(state.cursos[0].id);
  }

  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('active');
  document.getElementById('hdrUser').textContent = perfil.nombre + '  ·  ' + roleLabel(state.role);
  document.getElementById('hdrEmpresa').textContent = state.role==='estudiante' ? (state.empresa.nombre || 'Empresa por crear') : (state.role==='docente' ? 'Panel docente' : 'Universidad Francisco de Paula Santander Ocaña');
  currentView = 'inicio';
  renderSidebar();
  renderMain();
}
async function intentarLogin(){
  const correo = val('log_usuario').trim();
  const password = val('log_password');
  if(!correo || !password){ state.loginError = 'Ingresa tu correo y tu contraseña.'; renderLogin(); return; }
  showToast('Verificando...');
  const r = await sbIniciarSesion(correo, password);
  if(!r.ok){ state.loginError = r.error; renderLogin(); return; }
  state.loginError = '';
  await loginAs(r.perfil);
}
async function crearCuentaEstudiante(){
  const nombre = val('reg_nombre').trim();
  const correo = val('reg_usuario').trim();
  const password = val('reg_password');
  const equipoId = val('reg_equipo');
  if(!nombre || !correo || !password){ state.loginError = 'Completa nombre, correo y contraseña.'; renderLogin(); return; }
  if(!equipoId){ state.loginError = 'Selecciona un grupo válido.'; renderLogin(); return; }

  state.loginError = '';
  state.showRegistro = false;
  await loginAs(r.perfil);
}

/* ---------------------- helpers de avance/semaforo ---------------------- */
function avanceGlobal(){
  const totalCaract = state.procesos.length;
  const hechas = Object.keys(state.caracterizaciones).length;
  const misionOk = state.planeacion.mision.length>20 ? 1:0;
  const docsAprobados = state.documentos.filter(d=>d.estado==='Aprobado').length;
  const pesos = [
    misionOk*10,
    Math.round((hechas/totalCaract)*30),
    Math.round((docsAprobados/Math.max(state.documentos.length,1))*30),
    (state.indicadores.length>0?15:0),
    15 // estructura organizacional (fija en demo)
  ];
  return Math.min(100, pesos.reduce((a,b)=>a+b,0));
}
function semaforoFromPct(p){ return p>=75?'verde':p>=40?'amarillo':p===0?'gris':'rojo'; }

function construirOrganigramaVertical(paraPDF){
  if(!state.cargos.length) return paraPDF ? '<p style="font-size:11px;">Sin cargos registrados.</p>' : '<div class="empty-note">Aún no se han creado cargos. Agrega el primero abajo.</div>';
  const hijos = {};
  state.cargos.forEach(c=>{
    const sup = c.superior || '__root__';
    if(!hijos[sup]) hijos[sup] = [];
    hijos[sup].push(c);
  });
  function nodo(c){
    const subhijos = hijos[c.cargo] || [];
    return `<li>
      <div class="org-box">${c.cargo}<br><span style="font-size:10.5px;color:var(--gris-texto);">${c.area||'Área sin definir'}</span>
        ${paraPDF ? '' : `<div class="move-links">

          <span class="del-link" data-action="eliminarCargo" data-arg="${c.cargo}">Eliminar</span>
        </div>`}
      </div>
      ${subhijos.length ? `<ul class="orgv">${subhijos.map(nodo).join('')}</ul>` : ''}
    </li>`;
  }
  const raices = hijos['__root__'] || [];
  return `<div class="orgv-wrap"><ul class="orgv">${raices.map(nodo).join('')}</ul></div>`;
}
function construirOrganigramaCircular(paraPDF){
  if(!state.cargos.length) return paraPDF ? '<p style="font-size:11px;">Sin cargos registrados.</p>' : '<div class="empty-note">Aún no se han creado cargos. Agrega el primero abajo.</div>';
  const hijos = {};
  state.cargos.forEach(c=>{
    const sup = c.superior || '__root__';
    if(!hijos[sup]) hijos[sup] = [];
    hijos[sup].push(c);
  });
  const porNivel = {};
  function recorrer(nombreSuperior, depth){
    (hijos[nombreSuperior]||[]).forEach(c=>{
      if(!porNivel[depth]) porNivel[depth] = [];
      porNivel[depth].push(c);
      recorrer(c.cargo, depth+1);
    });
  }
  recorrer('__root__', 0);

  const cx = 350, cy = 280;
  const posiciones = {};
  Object.keys(porNivel).forEach(depthStr=>{
    const depth = parseInt(depthStr,10);
    const nivelNodos = porNivel[depth];
    const n = nivelNodos.length;
    const radio = (depth===0 && n===1) ? 0 : 70 + depth*95;
    nivelNodos.forEach((c,i)=>{
      let x, y;
      if(radio===0){ x = cx; y = cy; }
      else {
        const angulo = (-90 + (360/n)*i) * Math.PI/180;
        x = cx + radio*Math.cos(angulo);
        y = cy + radio*Math.sin(angulo);
      }
      posiciones[c.cargo] = {x, y, c};
    });
  });

  let lineas = '';
  state.cargos.forEach(c=>{
    if(c.superior && posiciones[c.superior] && posiciones[c.cargo]){
      const a = posiciones[c.superior]; const b = posiciones[c.cargo];
      lineas += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#1B4B91" stroke-width="1.5" />`;
    }
  });

  const cajas = Object.values(posiciones).map(p=>`
    <div class="org-radial-box" style="left:${p.x-55}px; top:${p.y-18}px; width:110px;">
      ${p.c.cargo}<br><span style="font-size:9px;color:var(--gris-texto);">${p.c.area||''}</span>
      ${paraPDF ? '' : `<div class="move-links">
        <span class="del-link" data-action="moverCargo" data-arg="${p.c.cargo}|up">↑</span>
        <span class="del-link" data-action="moverCargo" data-arg="${p.c.cargo}|down">↓</span>
        <span class="del-link" data-action="eliminarCargo" data-arg="${p.c.cargo}">Eliminar</span>
      </div>`}
    </div>`).join('');

  return `<div style="overflow-x:auto;">
    <div style="position:relative; width:700px; height:560px; margin:0 auto;">
      <svg width="700" height="560" style="position:absolute; top:0; left:0;">${lineas}</svg>
      ${cajas}
    </div>
  </div>`;
}

function construirArbolCargos(paraPDF){
  const hijos = {};
  state.cargos.forEach(c=>{
    const sup = c.superior || '__root__';
    if(!hijos[sup]) hijos[sup] = [];
    hijos[sup].push(c);
  });
  function render(nombreSuperior, nivel){
    const lista = hijos[nombreSuperior] || [];
    return lista.map(c => `
      <div style="margin-left:${nivel*26}px;padding:8px 12px;border-left:3px solid ${paraPDF?'#333':'var(--azul-medio)'};margin-bottom:6px;background:${nivel===0?(paraPDF?'#F2F2F2':'#F2F6FB'):'#fff'};border-radius:0 4px 4px 0;font-size:${paraPDF?'11px':'13.5px'};">
        <span style="font-weight:600;">${c.cargo}</span>

        <span class="del-link" data-action="moverCargo" data-arg="${c.cargo}|down">↓</span>
        <span class="del-link" data-action="eliminarCargo" data-arg="${c.cargo}">Eliminar</span>`}
      </div>
      ${render(c.cargo, nivel+1)}
    `).join('');
  }
  return render('__root__', 0) || (paraPDF ? '<p style="font-size:11px;">Sin cargos registrados.</p>' : '<div class="empty-note">Aún no se han creado cargos. Agrega el primero abajo.</div>');
}
async function crearCargo(){

  if(state.cargos.some(c=>c.cargo===cargo)){ showToast('Ya existe un cargo con ese nombre'); return; }

  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }

  showToast('Guardando...');

  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }

}
async function eliminarCargo(nombre){
  const cargoEliminado = state.cargos.find(c=>c.cargo===nombre);
  if(!cargoEliminado) return;
  const nuevoSuperiorRow = cargoEliminado.superior ? state.cargos.find(c=>c.cargo===cargoEliminado.superior) : null;
  showToast('Eliminando...');
  const r = await sbEliminarCargo(cargoEliminado.id, nuevoSuperiorRow ? nuevoSuperiorRow.id : null);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  await cargarLote1(state.empresa.id);
  showToast('Cargo eliminado de la estructura orgánica');
  renderMain();
}
function moverCargo(arg){
  const [nombre, direccion] = arg.split('|');
  const cargo = state.cargos.find(c=>c.cargo===nombre);
  if(!cargo) return;
  const hermanos = state.cargos.filter(c=>(c.superior||'')===(cargo.superior||''));
  const posEnHermanos = hermanos.indexOf(cargo);
  const posVecino = direccion==='up' ? posEnHermanos-1 : posEnHermanos+1;
  if(posVecino<0 || posVecino>=hermanos.length){ showToast('Ya está en ese extremo'); return; }
  const vecino = hermanos[posVecino];
  const iA = state.cargos.indexOf(cargo);
  const iB = state.cargos.indexOf(vecino);
  [state.cargos[iA], state.cargos[iB]] = [state.cargos[iB], state.cargos[iA]];
  showToast(`"${nombre}" se movió ${direccion==='up' ? 'a la izquierda/antes' : 'a la derecha/después'} (solo en esta sesión: el orden entre hermanos todavía no se guarda en la base de datos)`);
  renderMain();
}

async function crearPolitica(){
  const texto = val('p_texto'); if(!texto){ showToast('Escribe el texto de la política'); return; }
  const tipo = val('p_tipo');
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  showToast('Guardando...');
  const r = await sbCrearPolitica(state.empresa.id, tipo, texto);
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.politicas = (await sbListarPoliticas(state.empresa.id)).map(p=>({id:p.id, tipo:p.tipo, texto:p.texto}));
  showToast('Política agregada'); renderMain();
}
async function eliminarPolitica(id){
  showToast('Eliminando...');
  const r = await sbEliminarPolitica(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.politicas = state.politicas.filter(p=>p.id!==id);

async function crearObjetivo(){
  const descripcion = val('o_descripcion'); if(!descripcion){ showToast('Escribe la descripción del objetivo'); return; }
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  const codigo = `OBJ-${String(state.objCounter).padStart(2,'0')}`;
  const tipo = val('o_tipo'); const meta = val('o_meta');
  showToast('Guardando...');
  const r = await sbCrearObjetivo(state.empresa.id, { codigo, tipo, descripcion, meta });
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.objCounter++;

  const indNombre = val('o_ind_nombre'); const indFormula = val('o_ind_formula');
  let mensaje = `Objetivo creado: ${codigo}`;
  let huboIndicador = false;
  if(indNombre && indFormula){
    const indCodigo = `IND-${codigo}`;
    await sbCrearIndicadorDeObjetivo(state.empresa.id, r.objetivo.id, {
      codigo: indCodigo, nombre: indNombre, formula: indFormula,
      meta: val('o_ind_meta'), frecuencia: val('o_ind_frecuencia')||'Mensual'
    });
    mensaje += ` con indicador ${indCodigo}`;
    huboIndicador = true;
  }
  await cargarLote1(state.empresa.id);
  if(huboIndicador) await cargarIndicadores(state.empresa.id);
  showToast(mensaje); renderMain();
}
async function eliminarObjetivo(id){
  showToast('Eliminando...');
  const indicadorVinculado = state.indicadores.find(i=>i.objetivoId===id);
  if(indicadorVinculado){
    const rInd = await sb.from('indicadores').delete().eq('id', indicadorVinculado.id);
    if(rInd.error){ showToast('No se pudo eliminar: ' + rInd.error.message); return; }
  }
  const r = await sbEliminarObjetivo(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  await cargarLote1(state.empresa.id);
  await cargarIndicadores(state.empresa.id);
  showToast('Objetivo eliminado'); renderMain();
}

function clasificarParteInteresada(influencia, interes){
  const altaInf = influencia >= 3, altoInt = interes >= 3;
  if(altaInf && altoInt) return {label:'Gestionar de cerca', cls:'rojo'};
  if(altaInf && !altoInt) return {label:'Mantener satisfecha', cls:'amarillo'};
  if(!altaInf && altoInt) return {label:'Mantener informada', cls:'amarillo'};
  return {label:'Supervisar', cls:'gris'};
}

function nivelRiesgo(prob, imp){
  const v = prob*imp;
  if(v<=4) return {v,label:'Bajo',cls:'verde'};
  if(v<=9) return {v,label:'Moderado',cls:'amarillo'};
  if(v<=16) return {v,label:'Alto',cls:'rojo'};
  return {v,label:'Extremo',cls:'rojo'};
}
function nivelRiesgoSST(prob, cons){
  const escala = {Baja:1, Media:2, Alta:3};
  const escalaC = {Leve:1, Grave:2, 'Muy grave':3};
  const v = (escala[prob]||1) * (escalaC[cons]||1);
  if(v<=1) return {v,label:'Aceptable',cls:'verde'};
  if(v<=4) return {v,label:'Moderado',cls:'amarillo'};
  return {v,label:'No aceptable',cls:'rojo'};
}

const PDF_MARGEN = 36; // puntos (~1.27 cm) de margen en las cuatro caras

function esperarImagenes(container){
  const imgs = Array.from(container.querySelectorAll('img'));
  return Promise.all(imgs.map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>{ img.onload = res; img.onerror = res; });
  }));
}

/** Recibe un arreglo de bloques HTML (uno por sección lógica: encabezado, cada
 *  tabla/matriz, control documental, etc.) y arma el PDF colocando cada sección
 *  completa; si no cabe en lo que queda de la página, salta a una nueva en vez
 *  de cortarla a la mitad. Solo si una sección por sí sola es más alta que una
 *  página completa, esa sección puntual se reparte en fragmentos. */
async function generarPDFDesdeSecciones(secciones, filename){
  if(typeof html2canvas === 'undefined' || !window.jspdf){ showToast('No se pudo cargar el generador de PDF. Verifica tu conexión.'); return; }
  showToast('Generando PDF...');
  const tpl = document.getElementById('pdfTemplate');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'pt', 'a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const usableWidth = pageWidth - PDF_MARGEN*2;
  const usableHeight = pageHeight - PDF_MARGEN*2;
  let y = PDF_MARGEN;

  try {
    for (let i = 0; i < secciones.length; i++) {
      tpl.innerHTML = `<div style="font-family:Georgia, serif; color:#111; width:730px;">${secciones[i]}</div>`;
      await esperarImagenes(tpl);
      const canvas = await html2canvas(tpl, { backgroundColor: '#ffffff', scale: 2 });
      const imgWidth = usableWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;

      if (imgHeight <= usableHeight) {
        if (y !== PDF_MARGEN && y + imgHeight > PDF_MARGEN + usableHeight) {
          pdf.addPage(); y = PDF_MARGEN;
        }
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', PDF_MARGEN, y, imgWidth, imgHeight);
        y += imgHeight + 14;
      } else {
        // Esta sección puntual no cabe en una sola página: se reparte. Si en la página
        // actual todavía queda un espacio útil, se empieza a llenar ahí mismo en vez de
        // desperdiciarlo saltando a una página nueva en blanco.
        const espacioRestante = usableHeight - (y - PDF_MARGEN);
        if (y !== PDF_MARGEN && espacioRestante < usableHeight * 0.15) { pdf.addPage(); y = PDF_MARGEN; }
        const pxPorPt = canvas.width / imgWidth;
        let sy = 0;
        while (sy < canvas.height) {
          const altoDisponiblePt = usableHeight - (y - PDF_MARGEN);
          const altoPx = Math.min(canvas.height - sy, altoDisponiblePt * pxPorPt);
          const trozo = document.createElement('canvas');
          trozo.width = canvas.width;
          trozo.height = altoPx;
          trozo.getContext('2d').drawImage(canvas, 0, sy, canvas.width, altoPx, 0, 0, canvas.width, altoPx);
          const altoTrozoPt = altoPx / pxPorPt;
          pdf.addImage(trozo.toDataURL('image/png'), 'PNG', PDF_MARGEN, y, imgWidth, altoTrozoPt);
          sy += altoPx;
          y += altoTrozoPt;
          if (sy < canvas.height) { pdf.addPage(); y = PDF_MARGEN; }
        }
        y += 14;
      }
    }
    pdf.save(filename);
  } catch (err) {
    console.error(err);
    showToast('No se pudo generar el PDF. Intenta de nuevo.');
  }
}

/** Compatibilidad: recibe una sola sección (documentos cortos que caben en una

function capturarYDescargarPDF(htmlContent, filename){
  generarPDFDesdeSecciones([htmlContent], filename);

function generarPDFProcedimiento(id){
  const p = state.procedimientos.find(x=>x.id===id);
  if(!p){ showToast('Procedimiento no encontrado'); return; }
  const doc = state.documentos.find(d=>d.procedimientoId===id);
  const empresaOriginal = { nombre: state.empresa.nombre, logo: state.empresa.logo };
  if(doc){ state.empresa.nombre = doc.empresaNombre || empresaOriginal.nombre; state.empresa.logo = doc.empresaLogo || empresaOriginal.logo; }
  const secciones = plantillaProcedimientoSecciones(p);
  state.empresa.nombre = empresaOriginal.nombre; state.empresa.logo = empresaOriginal.logo;
  generarPDFDesdeSecciones(secciones, `${p.codigo}.pdf`);
}

async function guardarDocumentoContenido(){
  const tipo = state.docBuilderTipo;
  const nombre = val('dc_nombre'); if(!nombre){ showToast('Escribe el nombre del documento'); return; }
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  const proceso = val('dc_proceso');
  const codigo = `${DOC_TIPO_ABREV[tipo]}-${proceso}-${String(state.docCounter).padStart(3,'0')}-V01`;
  const get = (id) => document.getElementById(id) ? val(id) : '';
  const contenido = {
    objeto: get('dc_objeto'), alcance: get('dc_alcance'), responsable: get('dc_responsable'),
    texto: get('dc_texto'), items: [...state.docBuilderItems],
    elaboro: get('dc_elaboro'), elaboroCargo: get('dc_elaboroCargo'),
    reviso: get('dc_reviso'), revisoCargo: get('dc_revisoCargo'),
    aprobo: get('dc_aprobo'), aproboCargo: get('dc_aproboCargo'),
    fecha: get('dc_fecha')
  };
  showToast('Guardando...');
  const r = await sbCrearDocumentoGenerico(state.empresa.id, { codigo, nombre, tipo, procesoCodigo: proceso, contenido, items: contenido.items });
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.docCounter++;
  state.docBuilderTipo = null;
  state.docBuilderItems = [];
  await cargarLote3(state.empresa.id);
  showToast(`Documento creado: ${codigo}`);
  renderMain();
}

function formatoIndicadorValor(ind, valor, valorCualitativo){
  if(ind.tipo==='cualitativo') return valorCualitativo || '—';
  if(valor===null || valor===undefined) return '—';
  return ind.tipo==='porcentaje' ? `${valor}%` : `${valor}`;
}
function formatoIndicadorMeta(ind){
  if(ind.tipo==='cualitativo') return ind.metaCualitativa || '—';
  if(ind.meta===null || ind.meta===undefined) return '—';
  return ind.tipo==='porcentaje' ? `${ind.meta}%` : `${ind.meta}`;
}

async function crearIndicador(){
  const nombre = val('i_nombre'); if(!nombre){ showToast('Ingresa el nombre del indicador'); return; }
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  const proceso = val('i_proceso'); const formula = val('i_formula'); const tipo = val('i_tipo')||'numerico';
  const meta = val('i_meta') ? parseFloat(val('i_meta')) : null;
  const metaCualitativa = val('i_meta_cualitativa');
  const codigo = `IND-${proceso}-${String(state.indCounter).padStart(2,'0')}`;
  showToast('Guardando...');
  const r = await sbCrearIndicador(state.empresa.id, { codigo, nombre, procesoCodigo: proceso, formula, tipo, meta, metaCualitativa, frecuencia:'Mensual' });
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.indCounter++;
  await cargarIndicadores(state.empresa.id);
  showToast(`Indicador creado: ${codigo}`); renderMain();
}
async function registrarMedicion(){
  const id = val('m_indicador');
  const ind = state.indicadores.find(i=>i.id===id);
  if(!ind){ showToast('Selecciona un indicador válido'); return; }
  let valor, valorCualitativo;
  if(ind.tipo==='cualitativo'){
    valorCualitativo = val('m_valor_cualitativo');
    if(!valorCualitativo){ showToast('Ingresa el valor cualitativo obtenido'); return; }
  } else {
    valor = parseFloat(val('m_valor'));
    if(isNaN(valor)){ showToast('Ingresa un valor numérico'); return; }
  }
  showToast('Guardando...');
  const r = await sbRegistrarMedicion(id, valor, valorCualitativo);
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  await cargarIndicadores(state.empresa.id);
  showToast('Medición registrada'); renderMain();
}
function descargarIndicadoresPDF(){
  const filas = state.indicadores.map(i=>{
    const last = i.mediciones[i.mediciones.length-1];
    const cumple = last ? (i.tipo==='cualitativo' ? (last.valorCualitativo===i.metaCualitativa) : (last.valor>=i.meta)) : null;
    const estado = last ? (cumple ? 'Cumple' : 'No cumple') : 'Sin medición';
    return [i.codigo, i.nombre, i.proceso || (i.objetivoCodigo ? `Objetivo ${i.objetivoCodigo}` : '—'), i.formula,
      formatoIndicadorMeta(i), last ? formatoIndicadorValor(i, last.valor, last.valorCualitativo) : '—', estado];
  });
  const body = tablaGenerica(['Código','Nombre','Proceso','Fórmula','Meta','Último resultado','Estado'], filas);
  generarPDFGenerico(state.empresa.nombre||'Empresa por crear', 'Indicadores del sistema de gestión', body, `indicadores-${slug(state.empresa.nombre)}.pdf`);
}

async function crearNoConformidad(){
  const descripcion = val('nc_descripcion'); if(!descripcion){ showToast('Describe la no conformidad'); return; }
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  const codigo = `NC-${String(state.ncCounter).padStart(3,'0')}`;
  showToast('Guardando...');
  const r = await sbCrearNoConformidad(state.empresa.id, {
    codigo, fecha: new Date().toISOString().slice(0,10),
    fuente: val('nc_fuente'), procesoCodigo: val('nc_proceso'), descripcion,
    requisito: val('nc_requisito'), clasificacion: val('nc_clasificacion'),
    responsable: val('nc_responsable'), correccion: val('nc_correccion'),
    accionCorrectiva: val('nc_accion'), accionResponsable: val('nc_accionResponsable'), accionFecha: val('nc_accionFecha')
  });
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.ncCounter++;
  await cargarNoConformidades(state.empresa.id);
  showToast(`No conformidad registrada: ${codigo}`);
  renderMain();
}
function mostrarCierreNC(id){
  state.ncCerrando = id;
  renderMain();
}
function cancelarCierreNC(){
  state.ncCerrando = null;
  renderMain();
}
async function cerrarNoConformidad(id){
  const campoVerificacion = document.getElementById('nc_verificacion_'+id);
  const verificacion = campoVerificacion ? campoVerificacion.value : '';
  showToast('Guardando...');
  const r = await sbCerrarNoConformidad(id, verificacion);
  if(!r.ok){ showToast('No se pudo cerrar: ' + r.error); return; }
  state.ncCerrando = null;
  await cargarNoConformidades(state.empresa.id);
  showToast('No conformidad cerrada, con verificación de eficacia registrada');
  renderMain();
}
async function eliminarNoConformidad(id){
  showToast('Eliminando...');
  const r = await sbEliminarNoConformidad(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.noConformidades = state.noConformidades.filter(n=>n.id!==id);
  showToast('No conformidad eliminada');
  renderMain();
}
function descargarNoConformidadesPDF(){
  const body = tablaGenerica(
    ['Código','Fecha','Fuente','Proceso','Descripción','Clasificación','Acción correctiva','Responsable','Fecha compromiso','Estado'],
    state.noConformidades.map(n=>[n.codigo, n.fecha, n.fuente, n.proceso, n.descripcion, n.clasificacion, n.accionCorrectiva, n.accionResponsable, n.accionFecha, n.estado])
  );
  generarPDFGenerico(state.empresa.nombre||'Empresa por crear', 'Reporte de no conformidades', body, `no-conformidades-${slug(state.empresa.nombre)}.pdf`);
}

function progresoRetoHTML(etapa){
  const nombres = ['Cadena de valor','Problemas','5S','Decisiones','Resultados'];
  return `<div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;">
    ${nombres.map((n,i)=>{
      const num=i+1;
      const estado = num<etapa?'verde':(num===etapa?'amarillo':'gris');
      return `<span class="badge ${estado}">${num===5?'Resultados':`Etapa ${num} de 5`}${num<5?' · '+n:''}</span>`;
    }).join('')}
  </div>`;
}
function vRetoProduccion(){
  const r = state.retoProduccion || {etapa:1, respuestas:{situaciones:{},decisiones:[]}, indicadores:null, completado:false};
  const intro = `
    <div class="crumb">Retos</div>
    <h1 class="page-title">Reto: Mejora del proceso productivo</h1>
    <p style="font-size:13px;color:var(--gris-texto);margin-top:-10px;">

      aplicando el ciclo Producción → Calidad → SST → Ambiental → Satisfacción del cliente. Dura unos 10 minutos.
    </p>
    ${progresoRetoHTML(r.etapa)}
  `;
  if(r.etapa===1) return intro + vRetoEtapa1();
  if(r.etapa===2) return intro + vRetoEtapa2(r);
  if(r.etapa===3) return intro + vRetoEtapa3(r);
  if(r.etapa===4) return intro + vRetoEtapa4(r);
  return intro + vRetoEtapa5(r);
}

  sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });

}

function mostrarDescCadenaReto(id){
  state.retoCadenaAbierta = (state.retoCadenaAbierta===id) ? null : id;
  renderMain();
}
async function avanzarEtapaReto(){
  const r = state.retoProduccion;
  r.etapa = Math.min(5, r.etapa+1);
  const guardado = await sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  if(!guardado.ok) showToast('No se pudo guardar tu avance: ' + guardado.error);
  renderMain();
}
function seleccionarEtapaSituacionReto(situacionId, etapaId){
  const r = state.retoProduccion;
  if(!r.respuestas.situaciones[situacionId]) r.respuestas.situaciones[situacionId] = {};
  r.respuestas.situaciones[situacionId].etapa = etapaId;
  sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  renderMain();
}
function seleccionarPrincipioSituacionReto(situacionId, principioId){
  const r = state.retoProduccion;
  if(!r.respuestas.situaciones[situacionId]) r.respuestas.situaciones[situacionId] = {};
  r.respuestas.situaciones[situacionId].principio = principioId;
  sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  renderMain();
}
function toggleDecisionReto(decisionId){
  const r = state.retoProduccion;
  const idx = r.respuestas.decisiones.indexOf(decisionId);
  if(idx===-1) r.respuestas.decisiones.push(decisionId); else r.respuestas.decisiones.splice(idx,1);
  sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  renderMain();
}
async function finalizarReto(){
  const r = state.retoProduccion;
  r.indicadores = calcularIndicadoresReto(r.respuestas.situaciones, r.respuestas.decisiones, r.respuestas.problemas);
  r.etapa = 5; r.completado = true;
  const guardado = await sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  if(!guardado.ok) showToast('No se pudo guardar tu resultado: ' + guardado.error);
  renderMain();
}
async function recalcularResultadosReto(){
  const r = state.retoProduccion;
  r.indicadores = calcularIndicadoresReto(r.respuestas.situaciones, r.respuestas.decisiones, r.respuestas.problemas);
  const guardado = await sbGuardarRetoProduccion(state.miEquipoId, { etapa:r.etapa, respuestas:r.respuestas, indicadores:r.indicadores, completado:r.completado });
  if(!guardado.ok){ showToast('No se pudo recalcular: ' + guardado.error); return; }
  showToast('Resultados recalculados');
  renderMain();
}
async function reiniciarReto(){
  state.retoProduccion = { etapa:1, respuestas:{situaciones:{},decisiones:[],problemas:{}}, indicadores:null, completado:false };
  state.retoCadenaAbierta = null;
  const guardado = await sbGuardarRetoProduccion(state.miEquipoId, state.retoProduccion);
  if(!guardado.ok) showToast('No se pudo reiniciar: ' + guardado.error);
  renderMain();
}

function plantillaManualCalidadHTML(){
  const e = state.empresa;

  // 1. Ficha corporativa
  const sFicha = `<table style="width:100%;border-collapse:collapse;">
    ${filaPDF('Sector económico', e.sector)}
    ${filaPDF('Actividad económica', e.actividad)}
    ${filaPDF('Tamaño empresarial', e.tamano)}
    ${filaPDF('Número de trabajadores', e.trabajadores)}
    ${filaPDF('Ubicación', e.ubicacion)}
    ${filaPDF('Descripción general', e.descripcion)}
    ${filaPDF('Alcance del Sistema Integrado de Gestión', e.alcanceSIG)}
  </table>`;

  // 2. Misión y visión
  const sPlaneacion = `<table style="width:100%;border-collapse:collapse;">
    ${filaPDF('Misión', state.planeacion.mision)}
    ${filaPDF('Visión', state.planeacion.vision)}
  </table>`;

  // 3. Políticas y objetivos
  const polHTML = state.politicas.map(p=>filaPDF(p.tipo, p.texto)).join('') || filaPDF('Políticas','Sin políticas registradas.');
  const sPoliticas = `<table style="width:100%;border-collapse:collapse;margin-bottom:10px;">${polHTML}</table>
    ${tablaGenerica(['Código','Tipo','Descripción','Meta'], state.objetivos.map(o=>[o.codigo,o.tipo,o.descripcion,o.meta]))}`;

  // 4. Estructura orgánica
  const sEstructura = state.tipoOrganigrama==='circular' ? construirOrganigramaCircular(true)
    : state.tipoOrganigrama==='vertical' ? construirOrganigramaVertical(true)
    : construirArbolCargos(true);

  // 5. Mapa de procesos (con entrada/salida)
  const sMapa = `
    <div style="border:1.5px solid #333;border-radius:6px;padding:8px 12px;margin-bottom:10px;background:#F2F6FB;font-size:11px;">
      <span style="font-size:13px;">→</span> <b>Entrada principal:</b> ${state.mapaEntrada}
    </div>
    ${filasMapaProcesosPDF()}
    <div style="border:1.5px solid #333;border-radius:6px;padding:8px 12px;margin-top:10px;background:#F2F6FB;font-size:11px;">
      <span style="font-size:13px;">←</span> <b>Salida principal:</b> ${state.mapaSalida}
    </div>`;

  // 6. Caracterización de procesos
  const sCaracterizacion = state.procesos.map(p=>{
    const c = state.caracterizaciones[p.id];
    if(!c) return '';
    return `<div style="margin-bottom:12px;">
      <div style="font-size:11.5px;font-weight:bold;">${p.codigo} — ${p.nombre}</div>
      <table style="width:100%;border-collapse:collapse;margin-top:4px;">
        ${filaPDF('Alcance', c.alcance)}${filaPDF('Planear', c.planear)}${filaPDF('Hacer', c.hacer)}
        ${filaPDF('Verificar', c.verificar)}${filaPDF('Actuar', c.actuar)}
      </table>
    </div>`;
  }).join('') || '<p style="font-size:11px;">Sin procesos caracterizados todavía.</p>';

  // 7. Matrices
  const sDofa = ['F','O','D','A'].map(k=>{
    const nombres = {F:'Fortalezas',O:'Oportunidades',D:'Debilidades',A:'Amenazas'};
    return `<div style="font-size:11px;font-weight:bold;margin-top:6px;">${nombres[k]}</div>
      <ul style="margin:2px 0 0 18px;font-size:10.5px;">${state.dofa[k].map(i=>`<li>${i.texto}</li>`).join('') || '<li>Sin elementos.</li>'}</ul>`;
  }).join('');
  const sRequisitos = tablaGenerica(['Código','Fuente','Descripción','Proceso','Estado'],
    state.requisitosLegales.map(r=>[r.codigo,r.fuente,r.descripcion,r.proceso,r.estado]));
  const sRiesgosOp = tablaGenerica(['Tipo','Proceso','Evento','Nivel','Control'],
    state.riesgosOportunidades.map(r=>{ const n=nivelRiesgo(r.probabilidad,r.impacto); return [r.tipo,r.proceso,r.evento,`${n.label} (${n.v})`,r.control]; }));
  const sSST = tablaGenerica(['Proceso','Peligro','Clasificación','Nivel'],
    state.sstPeligros.map(s=>{ const n=nivelRiesgoSST(s.probabilidad,s.consecuencia); return [s.proceso,s.peligro,s.clasificacion,n.label]; }));
  const sAmbiental = tablaGenerica(['Proceso','Aspecto ambiental','Impacto','Significancia'],
    state.riesgosAmbientales.map(a=>{ const n=nivelRiesgo(a.probabilidad,a.severidad); return [a.proceso,a.aspecto,a.impacto,`${n.label} (${n.v})`]; }));

  // 8. Listado documental (referencia general)
  const sDocumental = tablaGenerica(['Código','Nombre','Tipo','Versión','Estado'],
    state.documentos.map(d=>[d.codigo,d.nombre,d.tipo,d.version,d.estado]));

  // 9. Procedimientos elaborados (cada uno es su propia sección, para saltar de página limpiamente)
  const bloquesProcedimientos = state.procedimientos.length ? state.procedimientos.map(p=>`
    <div>
      <div style="font-size:11.5px;font-weight:bold;">${p.codigo} — ${p.nombre}</div>
      <table style="width:100%;border-collapse:collapse;margin-top:4px;margin-bottom:6px;">
        ${filaPDF('Objetivo', p.objetivo)}${filaPDF('Alcance', p.alcance)}${filaPDF('Responsable', p.responsable)}
      </table>
      ${tablaGenerica(['#','Descripción de actividades','Responsable','Evidencia'],
        p.actividades.map((a,i)=>[i+1, a.descripcion, a.responsable, a.evidencia]))}
    </div>`) : ['<p style="font-size:11px;">Tu equipo aún no ha elaborado procedimientos.</p>'];
  const seccionesProcedimientos = bloquesProcedimientos.map((html,i)=> i===0 ? seccionManualHTML('9. Procedimientos', html) : html);

  // 10. Formatos elaborados (cada uno es su propia sección)
  const documentosFormato = state.documentos.filter(d=>d.tipoInterno==='formato' && d.contenido);
  const bloquesFormatos = documentosFormato.length ? documentosFormato.map(d=>`
    <div>
      <div style="font-size:11.5px;font-weight:bold;">${d.codigo} — ${d.nombre}</div>
      <table style="width:100%;border-collapse:collapse;margin-top:4px;margin-bottom:6px;">
        ${filaPDF('Propósito', d.contenido.objeto)}${filaPDF('Responsable', d.contenido.responsable)}
      </table>
      ${tablaGenerica(['Campo','Tipo de dato'], d.contenido.items.map(it=>[it.a, it.b]))}
    </div>`) : ['<p style="font-size:11px;">Tu equipo aún no ha elaborado formatos.</p>'];
  const seccionesFormatos = bloquesFormatos.map((html,i)=> i===0 ? seccionManualHTML('10. Formatos', html) : html);

  // 11. Indicadores
  const sIndicadores = tablaGenerica(['Código','Nombre','Meta','Último resultado'],
    state.indicadores.map(i=>{ const last=i.mediciones[i.mediciones.length-1]; return [i.codigo,i.nombre,i.meta,last?last.valor:'—']; }));

  // 12. No conformidades y acciones correctivas
  const sNC = tablaGenerica(['Código','Fecha','Clasificación','Acción correctiva','Responsable','Fecha compromiso','Estado'],
    state.noConformidades.map(n=>[n.codigo,n.fecha,n.clasificacion,n.accionCorrectiva,n.accionResponsable,n.accionFecha,n.estado]));

  return [
    encabezadoDocumentoHTML('Manual de calidad', 'Manual del Sistema Integrado de Gestión', 'V01'),
    seccionManualHTML('1. Ficha corporativa', sFicha),
    seccionManualHTML('2. Misión y visión', sPlaneacion),
    seccionManualHTML('3. Políticas y objetivos estratégicos', sPoliticas),
    seccionManualHTML('4. Estructura orgánica', sEstructura),
    seccionManualHTML('5. Mapa de procesos', sMapa),
    seccionManualHTML('6. Caracterización de procesos', sCaracterizacion),
    seccionManualHTML('7.1 Matriz DOFA', sDofa),
    seccionManualHTML('7.2 Matriz de requisitos legales', sRequisitos),
    seccionManualHTML('7.3 Matriz de riesgos y oportunidades', sRiesgosOp),
    seccionManualHTML('7.4 Identificación de peligros y riesgos SST', sSST),
    seccionManualHTML('7.5 Matriz de riesgos ambientales', sAmbiental),
    seccionManualHTML('8. Listado maestro de documentos', sDocumental),
    ...seccionesProcedimientos,
    ...seccionesFormatos,
    seccionManualHTML('11. Indicadores', sIndicadores),
    seccionManualHTML('12. No conformidades y acciones correctivas', sNC),
    construirControlDocumentalGenerico()
  ];
}

async function crearAccionPreventiva(){
  const descripcion = val('ap_descripcion'); if(!descripcion){ showToast('Describe la acción preventiva'); return; }
  if(!state.empresa.id){ showToast('Primero crea la ficha de tu empresa'); return; }
  const codigo = `AP-${String(state.apCounter).padStart(3,'0')}`;
  showToast('Guardando...');
  const r = await sbCrearAccionPreventiva(state.empresa.id, {
    codigo, fecha: new Date().toISOString().slice(0,10),
    origen: val('ap_origen'), procesoCodigo: val('ap_proceso'), descripcion,
    responsable: val('ap_responsable'), fechaCompromiso: val('ap_fecha')
  });
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.apCounter++;
  await cargarAccionesPreventivas(state.empresa.id);
  showToast(`Acción preventiva registrada: ${codigo}`);
  renderMain();
}

async function cerrarAccionPreventiva(id){
  const campo = document.getElementById('ap_verificacion_'+id);

  const r = await sbCerrarAccionPreventiva(id, verificacion);

  state.apCerrando = null;

  showToast('Acción preventiva cerrada, con verificación de eficacia registrada');
  renderMain();
}
async function eliminarAccionPreventiva(id){
  showToast('Eliminando...');

  state.accionesPreventivas = state.accionesPreventivas.filter(a=>a.id!==id);
  showToast('Acción preventiva eliminada');

function renderDocente(view){
  if(view==='inicio') return vInicioDocente();
  if(view==='seguimiento') return vSeguimiento();
  if(view==='revision') return vRevisionTrabajo();
  if(view==='aprobaciones') return vAprobaciones();
  if(view==='incidentesdocente') return vIncidentesDocente();
  if(view==='rubricas') return vRubricas();
  if(view==='informes') return vInformesDocente();
  return '<p>Vista no encontrada.</p>';
}

async function crearEquipo(){
  const nombre = val('eq_nombre'); if(!nombre){ showToast('Escribe el nombre del equipo'); return; }
  const cursoId = val('eq_curso');
  if(!cursoId){ showToast('No tienes ningún curso asignado todavía. Pide al administrador que te asigne uno.'); return; }
  const cupoMaximo = parseInt(val('eq_cupo'),10) || 4;
  showToast('Guardando...');
  const r = await sbCrearEquipo({ cursoId, nombre, cupoMaximo });
  if(!r.ok){ showToast('No se pudo crear: ' + r.error); return; }
  state.equipos = (await sbListarEquipos()).map(adaptarEquipoSb);
  showToast(r.avisoEmpresa || `Equipo "${nombre}" creado. Ya tiene acceso para crear su empresa simulada.`);
  renderMain();
}
async function eliminarEquipo(id){
  showToast('Eliminando...');
  const r = await sbEliminarEquipo(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.equipos = (await sbListarEquipos()).map(adaptarEquipoSb);
  showToast('Equipo eliminado');
  renderMain();
}
function agregarIntegrante(id){
  const input = document.getElementById('int_'+id);
  const nombre = input.value.trim();
  if(!nombre){ showToast('Escribe el nombre del estudiante'); return; }
  const eq = state.equipos.find(e=>e.id===id);
  if(eq.integrantes.length >= eq.cupoMaximo){ showToast(`Este equipo ya alcanzó su cupo máximo de ${eq.cupoMaximo} integrantes`); return; }
  eq.integrantes.push(nombre);
  if(!eq.liderNombre) eq.liderNombre = nombre;
  showToast('Estudiante agregado al equipo');
  renderMain();
}
async function crearEstudianteDocente(equipoId){
  const eq = state.equipos.find(e=>e.id===equipoId); if(!eq) return;
  const nombre = val('destu_nombre_'+equipoId).trim();
  const correo = val('destu_usuario_'+equipoId).trim();
  const password = val('destu_password_'+equipoId);
  if(!nombre || !correo || !password){ showToast('Completa nombre, correo y contraseña'); return; }
  if(eq.integrantes.length >= eq.cupoMaximo){ showToast(`Este equipo ya alcanzó su cupo máximo de ${eq.cupoMaximo} integrantes`); return; }
  showToast('Creando cuenta...');
  const r = await sbCrearEstudianteDocente({ nombre, correo, password, equipoId });
  if(!r.ok || !r.usuarioId){ showToast('No se pudo crear la cuenta: ' + (r.error || 'la función no confirmó la creación. ¿Está desplegado el código correcto de "crear-estudiante"?')); return; }
  await cargarDatosDesdeSupabase();
  showToast(`Cuenta creada para ${nombre}`);
  renderMain();
}

async function crearIncidente(){
  const descripcion = val('inc_descripcion'); if(!descripcion){ showToast('Describe el incidente'); return; }
  const equipoSel = val('inc_equipo');
  const equipoIds = equipoSel==='todos' ? state.equipos.map(e=>e.id) : [equipoSel];
  const equipoRef = equipoSel==='todos' ? state.equipos[0] : state.equipos.find(e=>e.id===equipoSel);
  if(!equipoRef || !equipoRef.cursoId){ showToast('No se pudo determinar el curso de ese equipo'); return; }
  showToast('Guardando...');
  const r = await sbCrearIncidente({
    cursoId: equipoRef.cursoId, tipo: val('inc_tipo'), descripcion, preguntas: val('inc_preguntas'),
    fechaLimite: val('inc_fecha'), equipoIds
  });
  if(!r.ok){ showToast('No se pudo activar: ' + r.error); return; }
  await cargarIncidentesDocente();
  showToast('Incidente activado');
  renderMain();
}
async function eliminarIncidente(id){
  showToast('Eliminando...');
  const r = await sbEliminarIncidente(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.incidentes = state.incidentes.filter(i=>i.id!==id);
  showToast('Incidente eliminado');
  renderMain();
}
