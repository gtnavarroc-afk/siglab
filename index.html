      <textarea id="cmt_${d.id}" placeholder="Comentario para el equipo (obligatorio si se devuelve)..." style="width:100%;min-height:60px;margin-bottom:10px;padding:9px;border:1px solid var(--gris-borde);border-radius:4px;"></textarea>
      <button class="btn ok small" data-action="aprobarDoc" data-arg="${d.id}">Aprobar</button>
      <button class="btn warn small" data-action="devolverDoc" data-arg="${d.id}">Devolver con comentarios</button>
    </div>
  `).join('');
  return `
    <div class="crumb">Curso</div>
    <h1 class="page-title">Documentos por aprobar</h1>
    ${rows || '<div class="empty-note">No hay documentos pendientes de aprobación en este momento.</div>'}
  `;
}
async function aprobarDoc(id){
  showToast('Guardando...');
  const r = await sbActualizarEstadoDocumento(id, 'aprobado', state.currentUser ? state.currentUser.id : null);
  if(!r.ok){ showToast('No se pudo aprobar: ' + r.error); return; }
  await cargarDocumentosPendientesDocente();
  showToast('Documento aprobado'); renderMain();
}
async function devolverDoc(id){
  const c = document.getElementById('cmt_'+id).value;
  if(!c){ showToast('Escribe un comentario antes de devolver'); return; }
  showToast('Guardando...');
  const r = await sbActualizarEstadoDocumento(id, 'devuelto');
  if(!r.ok){ showToast('No se pudo devolver: ' + r.error); return; }
  await cargarDocumentosPendientesDocente();
  showToast('Documento devuelto al equipo con comentarios'); renderMain();
}
function vRubricas(){
  const pesoTotal = state.rubricaCriterios.reduce((a,c)=>a+c.peso,0);
  const criteriosRows = state.rubricaCriterios.map(c=>`
    <tr><td>${c.nombre}</td><td>${c.peso}%</td>
    <td><span class="del-link" data-action="eliminarCriterioRubrica" data-arg="${c.id}">Eliminar</span></td></tr>`
  ).join('') || '<tr><td colspan="3" class="empty-note">Sin criterios definidos.</td></tr>';

  const calRows = state.equipos.map(eq=>{
    const cal = state.calificaciones[eq.id];
    return `<tr>
      <td>${eq.nombre} — ${eq.empresa}</td>
      <td>${cal ? cal.nota.toFixed(1) : '—'}</td>
      <td>${cal ? cal.fecha : '—'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="crumb">Curso</div>
    <h1 class="page-title">Rúbrica y calificación</h1>

    <h2 class="section-title">Criterios de la rúbrica</h2>
    <table><thead><tr><th>Criterio</th><th>Peso</th><th></th></tr></thead>
      <tbody>${criteriosRows}</tbody></table>
    <p style="font-size:12px;color:${pesoTotal===100?'var(--gris-texto)':'var(--rojo)'};margin-top:8px;">
      Peso total: ${pesoTotal}%${pesoTotal!==100?' — debería sumar 100%':''}
    </p>
    <div class="inline-form">
      <div class="form-grid">
        <div class="form-row"><label>Nombre del criterio</label><input id="rc_nombre" placeholder="Ej. Capacidad de análisis"></div>
        <div class="form-row"><label>Peso (%)</label><input id="rc_peso" type="number" min="1" max="100" value="10"></div>
      </div>
      <button class="btn small secondary" data-action="agregarCriterioRubrica">+ Agregar criterio</button>
    </div>

    <h2 class="section-title">Calificar un equipo</h2>
    <div class="panel">
      <div class="form-grid">
        <div class="form-row"><label>Equipo</label>
          <select id="cal_equipo">${state.equipos.map(eq=>`<option value="${eq.id}">${eq.nombre} — ${eq.empresa}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Calificación (0.0 – 5.0)</label><input id="cal_nota" type="number" step="0.1" min="0" max="5" placeholder="Ej. 4.2"></div>
      </div>
      <div class="form-row"><label>Retroalimentación</label><textarea id="cal_retro" placeholder="Comentario general para el equipo..."></textarea></div>
      <button class="btn" data-action="guardarCalificacion">Guardar calificación</button>
    </div>

    <h2 class="section-title">Calificaciones registradas</h2>
    <table><thead><tr><th>Equipo</th><th>Nota</th><th>Fecha</th></tr></thead>
      <tbody>${calRows}</tbody></table>
  `;

async function agregarCriterioRubrica(){
  const nombre = val('rc_nombre'); if(!nombre){ showToast('Escribe el nombre del criterio'); return; }
  const peso = parseInt(val('rc_peso'),10) || 10;
  if(!state.cursos.length){ showToast('No tienes ningún curso asignado todavía'); return; }
  showToast('Guardando...');
  const r = await sbCrearCriterioRubrica(state.cursos[0].id, nombre, peso);
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  await cargarRubricaYCalificaciones(state.cursos[0].id);
  showToast('Criterio agregado a la rúbrica'); renderMain();
}
async function eliminarCriterioRubrica(id){
  showToast('Eliminando...');
  const r = await sbEliminarCriterioRubrica(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.rubricaCriterios = state.rubricaCriterios.filter(c=>c.id!==id);
  showToast('Criterio eliminado'); renderMain();
}
async function guardarCalificacion(){
  const equipoId = val('cal_equipo');
  const nota = parseFloat(val('cal_nota'));
  if(isNaN(nota)){ showToast('Ingresa una calificación numérica'); return; }
  const retro = val('cal_retro');
  showToast('Guardando...');
  const r = await sbGuardarCalificacion(equipoId, nota, retro);
  if(!r.ok){ showToast('No se pudo guardar: ' + r.error); return; }
  state.calificaciones[equipoId] = {nota, retro, fecha:new Date().toISOString().slice(0,10)};
  showToast('Calificación guardada'); renderMain();
}
function vInformesDocente(){
  return `
    <div class="crumb">Informes</div>

      <button class="btn secondary" data-action="toast" data-arg="Generando consolidado de calificaciones...">Consolidado de calificaciones</button>
    </div>
  `;
}

async function crearPeriodo(){
  const nombre = val('pe_nombre'); if(!nombre){ showToast('Escribe el nombre del periodo académico'); return; }
  if(state.periodos.some(p=>p.nombre===nombre)){ showToast('Ya existe un periodo con ese nombre'); return; }
  const instituciones = await sbListarInstituciones();
  if(!instituciones.length){ showToast('No hay ninguna institución creada todavía'); return; }
  const fechaInicio = val('pe_inicio'); const fechaFin = val('pe_fin');
  showToast('Guardando...');
  const r = await sbCrearPeriodo({ institucionId: instituciones[0].id, nombre, fechaInicio, fechaFin });
  if(!r.ok){ showToast('No se pudo crear: ' + r.error); return; }
  state.periodos = (await sbListarPeriodos()).map(adaptarPeriodoSb);
  showToast(`Periodo "${nombre}" creado`);
  renderMain();
}
async function eliminarPeriodo(id){
  showToast('Eliminando...');
  const r = await sbEliminarPeriodo(id);
  if(!r.ok){ showToast(r.error); return; }
  state.periodos = (await sbListarPeriodos()).map(adaptarPeriodoSb);
  showToast('Periodo académico eliminado');
  renderMain();
}
async function crearCurso(){
  const nombre = val('cu_nombre'); if(!nombre){ showToast('Escribe el nombre del curso'); return; }
  const periodoId = val('cu_periodo');
  if(!periodoId){ showToast('Crea primero un periodo académico en "Periodos académicos"'); return; }
  const periodo = state.periodos.find(p=>p.id===periodoId);
  if(!periodo){ showToast('Periodo no válido'); return; }
  const docenteId = val('cu_docente') || null;
  showToast('Guardando...');
  const r = await sbCrearCurso({ institucionId: periodo.institucionId, periodoId, nombre, docenteId });
  if(!r.ok){ showToast('No se pudo crear: ' + r.error); return; }
  state.cursos = (await sbListarCursos()).map(adaptarCursoSb);
  showToast(`Curso "${nombre}" creado`);
  renderMain();
}
async function eliminarCurso(id){
  showToast('Eliminando...');
  const r = await sbEliminarCurso(id);
  if(!r.ok){ showToast('No se pudo eliminar: ' + r.error); return; }
  state.cursos = (await sbListarCursos()).map(adaptarCursoSb);
  showToast('Curso eliminado');
  renderMain();
}
async function asignarDocenteCurso(cursoId){
  const sel = document.getElementById('doc_'+cursoId);
  if(!sel) return;
  showToast('Guardando...');
  const r = await sbAsignarDocenteCurso(cursoId, sel.value || null);
  if(!r.ok){ showToast('No se pudo asignar: ' + r.error); return; }
  state.cursos = (await sbListarCursos()).map(adaptarCursoSb);
  showToast('Docente asignado al curso');
  renderMain();
}
function crearUsuario(){
  const nombre = val('u_nombre'); const usuario = val('u_usuario'); const password = val('u_password'); const rol = val('u_rol');
  if(!nombre || !usuario || !password){ showToast('Completa nombre, usuario y contraseña'); return; }
  if(state.usuarios.some(u=>u.usuario===usuario)){ showToast('Ese usuario ya existe'); return; }
  const nuevo = {id:state.usuarioCounter++, nombre, usuario, password, rol, activo:true};
  if(rol==='Estudiante'){
    const equipoId = parseInt(val('u_grupo'),10);
    nuevo.equipoId = equipoId;
    const eq = state.equipos.find(e=>e.id===equipoId);
    if(eq){
      if(eq.integrantes.length >= eq.cupoMaximo){ showToast('Ese grupo ya alcanzó su cupo máximo'); return; }
      eq.integrantes.push(nombre);
      if(!eq.liderNombre) eq.liderNombre = nombre;
    }
  }
  state.usuarios.push(nuevo);
  showToast(`Usuario "${usuario}" creado`);
  renderMain();
}
async function toggleActivoUsuario(id){
  const u = state.usuarios.find(x=>x.id===id);
  if(!u) return;
  const nuevoValor = (u.activo===false) ? true : false;
  showToast('Guardando...');
  const r = await sbToggleActivoUsuario(id, nuevoValor);
  if(!r.ok){ showToast('No se pudo actualizar: ' + r.error); return; }
  u.activo = nuevoValor;
  showToast(`${u.nombre} quedó ${u.activo?'activo':'inactivo'}`);
  renderMain();
}
async function crearGrupo(){
  const nombre = val('g_nombre'); if(!nombre){ showToast('Escribe el nombre del grupo'); return; }
  const cursoId = val('g_curso');
  if(!cursoId){ showToast('Crea primero un curso en "Cursos"'); return; }
  const cupoMaximo = parseInt(val('g_cupo'),10) || 4;
  showToast('Guardando...');
  const r = await sbCrearEquipo({ cursoId, nombre, cupoMaximo });
  if(!r.ok){ showToast('No se pudo crear: ' + r.error); return; }
  state.equipos = (await sbListarEquipos()).map(adaptarEquipoSb);
  showToast(r.avisoEmpresa || `Grupo "${nombre}" creado. Ya tiene acceso para crear su empresa.`);
  renderMain();
}
async function asignarLider(equipoId){
  const sel = document.getElementById('lider_'+equipoId);
  if(!sel || !sel.value) return;
  showToast('Guardando...');
  const r = await sbAsignarLider(equipoId, sel.value);
  if(!r.ok){ showToast('No se pudo asignar: ' + r.error); return; }
  state.equipos = (await sbListarEquipos()).map(adaptarEquipoSb);
  showToast('Líder asignado');
  renderMain();
}
